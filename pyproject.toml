[project]
name = "secure-open-source-devops"
version = "0.1.0"
description = "Secure Open Source DevOps Platform"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PLC", "C4", "DTZ", "RET", "TRY", "B", "SIM", "RUF", "PERF", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["fastapi", "pydantic", "sqlalchemy", "celery", "structlog", "httpx", "uvicorn"]
split-on-trailing-comma = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
addopts = ["-q"]
